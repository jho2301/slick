<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'" />
    <title>Slick</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-size='20' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171d" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slick" />
  </head>
  <body>
    <div id="app" class="app is-loading">
      <aside class="rail" id="rail">
        <header class="rail__head">
          <div class="rail__workspace">
            <span class="rail__mark">S</span>
            <div>
              <div class="rail__title" id="workspace-name">Slick</div>
              <div class="rail__user" id="workspace-user"></div>
            </div>
          </div>
          <button
            class="icon-btn icon-btn--ghost"
            id="btn-notifications"
            title="Enable notifications"
            aria-label="Enable notifications"
            aria-pressed="false"
            hidden
          >
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a1.5 1.5 0 00-1.5 1.5v.6C6 4.8 4.5 6.9 4.5 9.5V13L3 15v1h14v-1l-1.5-2V9.5c0-2.6-1.5-4.7-4-5.4v-.6A1.5 1.5 0 0010 2zm0 16a2 2 0 002-2H8a2 2 0 002 2z"/></svg>
          </button>
          <button class="icon-btn icon-btn--ghost" id="btn-search" title="Search (⌘K)" aria-label="Search">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 3a6 6 0 104.47 10.03l3.25 3.25 1.06-1.06-3.25-3.25A6 6 0 009 3zm0 1.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9z"/></svg>
          </button>
        </header>

        <nav class="rail__scroll" id="rail-scroll">
          <section class="rail__section">
            <button class="rail__heading" id="toggle-channels" aria-expanded="true">
              <span class="rail__chev">▾</span> Channels
            </button>
            <ul class="channel-list" id="channel-list"></ul>
            <button class="rail__add" id="btn-new-channel">
              <span class="rail__plus">+</span> Add channel
            </button>
          </section>

          <section class="rail__section" id="agents-section">
            <button class="rail__heading" id="toggle-agents" aria-expanded="true">
              <span class="rail__chev">▾</span> Agents
            </button>
            <ul class="agent-list" id="agent-list"></ul>
          </section>

          <section class="rail__section rail__section--archived" id="archived-section" hidden>
            <button class="rail__heading" id="toggle-archived" aria-expanded="false">
              <span class="rail__chev">▸</span> Archived
            </button>
            <ul class="channel-list" id="archived-list" hidden></ul>
          </section>
        </nav>

        <footer class="rail__foot">
          <span class="dot" id="conn-dot"></span>
          <span id="conn-label">connecting…</span>
        </footer>
      </aside>

      <main class="main" id="main">
        <header class="chan-head" id="chan-head">
          <div class="chan-head__left">
            <button class="icon-btn icon-btn--ghost only-narrow" id="btn-menu" aria-label="Channels">☰</button>
            <h1 class="chan-head__title" id="chan-title">#general</h1>
            <button class="chan-head__topic" id="chan-topic" title="Edit topic"></button>
          </div>
          <div class="chan-head__actions">
            <button class="chip" id="btn-edit-channel">Edit</button>
            <button class="chip" id="btn-archive-channel">Archive</button>
            <button class="chip chip--danger" id="btn-delete-channel">Delete</button>
          </div>
        </header>

        <div class="timeline" id="timeline">
          <div class="timeline__inner" id="messages"></div>
        </div>

        <button class="jump" id="btn-jump" hidden>Jump to latest ↓</button>

        <form class="composer" id="composer">
          <div class="composer__box">
            <ul class="mention-menu" id="mention-menu-main" hidden></ul>
            <textarea
              id="composer-input"
              class="composer__input"
              rows="1"
              placeholder="Message"
              autocomplete="off"
              spellcheck="true"
            ></textarea>
            <div class="composer__row">
              <span class="composer__hint">
                <b>Enter</b> to send · <b>Shift+Enter</b> for a new line
              </span>
              <button type="submit" class="send-btn" id="btn-send" disabled aria-label="Send">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10l16-7-7 16-2-6-7-3z"/></svg>
              </button>
            </div>
          </div>
        </form>
      </main>

      <aside class="thread" id="thread" hidden>
        <header class="thread__head">
          <div>
            <div class="thread__title">Thread</div>
            <div class="thread__sub" id="thread-sub"></div>
          </div>
          <button class="icon-btn icon-btn--ghost" id="btn-close-thread" aria-label="Close thread">✕</button>
        </header>
        <div class="thread__scroll" id="thread-body"></div>
        <form class="composer composer--thread" id="thread-composer">
          <div class="composer__box">
            <ul class="mention-menu" id="mention-menu-thread" hidden></ul>
            <textarea id="thread-input" class="composer__input" rows="1" placeholder="Reply…"></textarea>
            <div class="composer__row">
              <span class="composer__hint">Replying in thread</span>
              <button type="submit" class="send-btn" id="btn-thread-send" disabled aria-label="Send reply">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10l16-7-7 16-2-6-7-3z"/></svg>
              </button>
            </div>
          </div>
        </form>
      </aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <dialog class="modal" id="modal">
      <form method="dialog" id="modal-form">
        <h2 class="modal__title" id="modal-title">Title</h2>
        <div class="modal__body" id="modal-body"></div>
        <footer class="modal__foot">
          <button type="button" class="btn btn--ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn--primary" id="modal-ok">Save</button>
        </footer>
      </form>
    </dialog>

    <div class="palette" id="palette" hidden>
      <div class="palette__box">
        <input
          id="palette-input"
          class="palette__input"
          placeholder="Jump to a channel, or type to search messages…"
          autocomplete="off"
        />
        <ul class="palette__results" id="palette-results"></ul>
        <div class="palette__foot"><b>↑↓</b> move · <b>Enter</b> open · <b>Esc</b> close</div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
